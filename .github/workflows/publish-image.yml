# Builds the Dockerfile and publishes it to GitHub Container Registry on every
# push to master as ghcr.io/davidahill/railway-db-backup (the name avoids "mysql",
# which Railway IaC would otherwise treat as a database image).
# Tags: <version>, <major>.<minor>, <major>, latest, sha-<short>.
# The version comes from package.json; bump it to publish a new release.
name: Publish image

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "assets/**"
      - ".railway/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/davidahill/railway-db-backup
          tags: |
            type=raw,value=${{ steps.version.outputs.full }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=railway-mysql-backup
            org.opencontainers.image.description=Scheduled, verified backups of a Railway MySQL service into a Railway bucket
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
